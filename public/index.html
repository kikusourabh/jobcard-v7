<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Card Generator</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#222; --muted:#6b6b6b; --line:#ddd7c8; --accent:#9c7a1e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17150f; --card:#221f17; --ink:#eee8d8; --muted:#a39d8c; --line:#3a3526; --accent:#d9b44a; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 18px; font-size:.9rem; }
  fieldset { background:var(--card); border:1px solid var(--line); border-radius:10px; margin:0 0 16px; padding:14px; }
  legend { padding:0 6px; font-weight:600; color:var(--accent); }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:12px; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:4px; }
  input, textarea { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  .uploads { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }

  .stage { position:relative; display:none; margin-top:8px; width:fit-content; max-width:100%; overflow:hidden; touch-action:none; cursor:crosshair; border:1px solid var(--line); border-radius:6px; user-select:none; }
  .stage img { display:block; max-width:100%; max-height:240px; pointer-events:none; -webkit-user-drag:none; }
  .sel { position:absolute; display:none; border:2px solid #fff; outline:1px solid #000; box-shadow:0 0 0 9999px rgba(0,0,0,.45); pointer-events:none; }
  .cropbar { display:none; margin-top:8px; gap:8px; align-items:center; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
  select { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); }
  .cropbar select { font:inherit; padding:5px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); }
  #mergeList li { margin:4px 0; } #mergeList button { background:none; color:var(--accent); padding:0 6px; font-size:.9rem; }
  .link { background:none; color:var(--accent); padding:0; font-size:.8rem; text-decoration:underline; }
  .pnorow { display:flex; gap:6px; } .pnorow input { flex:1; min-width:0; }
  button { background:var(--accent); color:#fff; border:0; padding:12px 22px; border-radius:8px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-left:12px; color:var(--muted); font-size:.9rem; }
  @media (max-width:520px){ .uploads { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>Jewellery Job Card</h1>
  <p class="sub">Fill the details, add images, and generate a 105 × 150 mm PDF.</p>

  <fieldset>
    <legend>Edit an existing job card</legend>
    <label>Upload a PDF generated by this app
      <input type="file" id="pdfInput" accept="application/pdf,.pdf">
    </label>
    <span id="importMsg" style="font-size:.85rem;color:var(--muted);display:block;margin-top:8px"></span>
  </fieldset>

  <fieldset>
    <legend>Merge PDFs into one</legend>
    <label>Add PDF files (you can add more than once)
      <input type="file" id="mergeInput" accept="application/pdf,.pdf" multiple>
    </label>
    <ol id="mergeList" style="padding-left:20px;margin:10px 0;font-size:.85rem"></ol>
    <div class="grid" style="align-items:end">
      <label>Merged file name <input id="mergeName" placeholder="merged"></label>
      <div><button type="button" id="mergeBtn" disabled>Merge PDFs</button></div>
    </div>
    <span id="mergeMsg" style="font-size:.85rem;color:var(--muted);display:block;margin-top:8px"></span>
  </fieldset>

  <form id="f">
    <fieldset>
      <legend>Images</legend>
      <div class="uploads">
        <div class="drop" id="designBox">
          <label>Design image <input type="file" name="designImage" accept="image/*"></label>
          <div class="stage"><img alt=""><div class="sel"></div></div>
          <div class="cropbar">
            <span>Drag on the image to crop.</span>
            <select name="cropMode">
              <option value="design">Use crop as design image</option>
              <option value="diamond">Add crop to diamond details image</option>
              <option value="both">Both</option>
            </select>
            <button type="button" class="link clear">Clear crop</button>
          </div>
          <input type="hidden" name="cropX"><input type="hidden" name="cropY">
          <input type="hidden" name="cropW"><input type="hidden" name="cropH">
        </div>
        <div class="drop" id="diamondBox">
          <label>Diamond details image <input type="file" name="diamondImage" accept="image/*"></label>
          <div class="stage"><img alt=""><div class="sel"></div></div>
          <div class="cropbar">
            <span>Drag on the image to crop.</span>
            <button type="button" class="link clear">Clear crop</button>
          </div>
          <input type="hidden" name="dcropX"><input type="hidden" name="dcropY">
          <input type="hidden" name="dcropW"><input type="hidden" name="dcropH">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Job details</legend>
      <div class="grid">
        <label>Category
          <select name="category" id="category" required><option value="">Select…</option></select></label>
        <label>P no (auto)
          <span class="pnorow"><input name="pno" id="pno" placeholder="auto"><button type="button" class="link" id="newPno">Next</button></span></label>
        <label>C name <input name="cname"></label>
        <label>File name <input name="fileName" placeholder="defaults to P no"></label>
        <label>O date <input type="date" name="odate"></label>
        <label>D date <input type="date" name="ddate"></label>
        <label>Karat <input name="karat" value="18"></label>
        <label>Color <input name="color" value="Yellow"></label>
        <label>Size <input name="size"></label>
        <label>Apx WTG <input name="apxWtg" placeholder="4.6 gm"></label>
        <label>Cad File <input name="cadFile"></label>
        <label>Quantity <input name="quantity" value="1"></label>
        <label>RPT <input name="rpt"></label>
        <label>Casting <input name="casting"></label>
      </div>
      <label style="margin-top:12px">Instruction <textarea name="instruction"></textarea></label>
    </fieldset>

    <button id="go" type="submit">Generate PDF</button><span id="msg"></span>
  </form>
</main>
<script>
  const f = document.getElementById('f');
  const pnoEl = document.getElementById('pno'), catEl = document.getElementById('category');
  async function loadPno() {
    if (!catEl.value) { pnoEl.value = ''; return; }
    try { pnoEl.value = (await (await fetch('/api/gen-pno?category=' + encodeURIComponent(catEl.value))).json()).pno; } catch {}
  }
  const catsReady = (async () => {
    const cats = await (await fetch('/api/categories')).json();
    cats.forEach((c) => catEl.add(new Option(c, c)));
  })();
  catEl.addEventListener('change', loadPno);
  document.getElementById('newPno').onclick = loadPno;

  // ---- crop tool (used for both images) ----
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  function initCropper(boxId, prefix) {
    const box = document.getElementById(boxId);
    const input = box.querySelector('input[type=file]');
    const stage = box.querySelector('.stage'), img = stage.querySelector('img'), sel = stage.querySelector('.sel');
    const bar = box.querySelector('.cropbar');
    const setCrop = (v) => ['X', 'Y', 'W', 'H'].forEach((n, i) => f[prefix + n].value = v ? v[i] : '');
    const clear = () => { sel.style.display = 'none'; bar.style.display = 'none'; setCrop(null); };
    box.querySelector('.clear').onclick = clear;

    input.addEventListener('change', () => {
      clear();
      const file = input.files[0];
      if (!file) { stage.style.display = 'none'; return; }
      img.src = URL.createObjectURL(file); stage.style.display = 'block';
    });

    let start = null;
    stage.addEventListener('pointerdown', (e) => {
      const r = img.getBoundingClientRect();
      start = { x: clamp(e.clientX - r.left, 0, r.width), y: clamp(e.clientY - r.top, 0, r.height) };
      stage.setPointerCapture(e.pointerId);
      sel.style.display = 'none';
    });
    stage.addEventListener('pointermove', (e) => {
      if (!start) return;
      const r = img.getBoundingClientRect();
      const x = clamp(e.clientX - r.left, 0, r.width), y = clamp(e.clientY - r.top, 0, r.height);
      Object.assign(sel.style, {
        display: 'block', left: Math.min(start.x, x) + 'px', top: Math.min(start.y, y) + 'px',
        width: Math.abs(x - start.x) + 'px', height: Math.abs(y - start.y) + 'px',
      });
    });
    stage.addEventListener('pointerup', () => {
      if (!start) return;
      start = null;
      const r = img.getBoundingClientRect();
      const w = parseFloat(sel.style.width) || 0, h = parseFloat(sel.style.height) || 0;
      if (w < 10 || h < 10) { clear(); return; }
      setCrop([parseFloat(sel.style.left) / r.width, parseFloat(sel.style.top) / r.height, w / r.width, h / r.height]);
      bar.style.display = 'flex';
    });
  }
  initCropper('designBox', 'crop');
  initCropper('diamondBox', 'dcrop');

  // ---- edit an existing PDF ----
  async function setFile(input, dataUrl, name) {
    if (dataUrl) {
      const blob = await (await fetch(dataUrl)).blob();
      const dt = new DataTransfer();
      dt.items.add(new File([blob], name, { type: blob.type }));
      input.files = dt.files;
    } else input.value = '';
    input.dispatchEvent(new Event('change'));   // refreshes preview + clears old crop
  }
  document.getElementById('pdfInput').addEventListener('change', async (e) => {
    const file = e.target.files[0], msg = document.getElementById('importMsg');
    if (!file) return;
    msg.textContent = 'Reading PDF…';
    try {
      const fd = new FormData(); fd.append('pdf', file);
      const res = await fetch('/api/import-pdf', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      await catsReady;
      Object.entries(data.fields).forEach(([k, v]) => { if (f.elements[k]) f.elements[k].value = v; });
      await setFile(f.designImage, data.designImage, 'design.jpg');
      await setFile(f.diamondImage, data.diamondImage, 'diamond.jpg');
      msg.textContent = 'Loaded ' + (data.fields.pno || 'job card') + ' - edit below, then click Generate PDF.';
      f.scrollIntoView({ behavior: 'smooth' });
    } catch (err) { msg.textContent = 'Error: ' + err.message; }
    e.target.value = '';
  });

  // ---- merge PDFs ----
  const mergeFiles = [];
  const mList = document.getElementById('mergeList'), mBtn = document.getElementById('mergeBtn');
  function renderMerge() {
    mList.textContent = '';
    mergeFiles.forEach((file, i) => {
      const li = document.createElement('li');
      li.append(file.name + ' (' + Math.max(1, Math.round(file.size / 1024)) + ' KB) ');
      [['↑', -1], ['↓', 1]].forEach(([sym, d]) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = sym;
        b.disabled = i + d < 0 || i + d >= mergeFiles.length;
        b.onclick = () => { [mergeFiles[i], mergeFiles[i + d]] = [mergeFiles[i + d], mergeFiles[i]]; renderMerge(); };
        li.append(b);
      });
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '✕';
      x.onclick = () => { mergeFiles.splice(i, 1); renderMerge(); };
      li.append(x); mList.append(li);
    });
    mBtn.disabled = mergeFiles.length < 2;
  }
  document.getElementById('mergeInput').addEventListener('change', (e) => {
    mergeFiles.push(...e.target.files); e.target.value = ''; renderMerge();
  });
  mBtn.addEventListener('click', async () => {
    const msg = document.getElementById('mergeMsg');
    mBtn.disabled = true; msg.textContent = 'Merging…';
    try {
      const fd = new FormData();
      mergeFiles.forEach((file) => fd.append('pdfs', file));
      fd.append('fileName', document.getElementById('mergeName').value);
      const res = await fetch('/api/merge', { method: 'POST', body: fd });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const fname = decodeURIComponent(res.headers.get('X-Filename') || '') || 'merged.pdf';
      const url = URL.createObjectURL(await res.blob());
      window.open(url, '_blank');
      const a = document.createElement('a'); a.href = url; a.download = fname; a.click();
      msg.textContent = 'Done ✓ ' + fname + ' (' + res.headers.get('X-Pages') + ' pages)';
    } catch (err) { msg.textContent = 'Error: ' + err.message; }
    mBtn.disabled = mergeFiles.length < 2;
  });

  // ---- submit ----
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'), msg = document.getElementById('msg');
    btn.disabled = true; msg.textContent = 'Generating…';
    try {
      const res = await fetch('/api/pdf', { method: 'POST', body: new FormData(f) });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const pno = res.headers.get('X-Pno') || 'job-card';
      const fname = decodeURIComponent(res.headers.get('X-Filename') || '') || pno + '.pdf';
      const url = URL.createObjectURL(await res.blob());
      window.open(url, '_blank');
      const a = document.createElement('a'); a.href = url; a.download = fname; a.click();
      msg.textContent = 'Done ✓ ' + fname;
      loadPno();
    } catch (err) { msg.textContent = 'Error: ' + err.message; }
    btn.disabled = false;
  });
</script>
</body>
</html>
